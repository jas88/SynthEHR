name: Build, Test, Package and Security Analysis

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]
  schedule:
    - cron: "33 3 * * 6"

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Build and run tests
        run: dotnet build -c Release --nologo && SynthEHRTests/bin/Release/net10.0/SynthEHRTests

      - name: Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build for CodeQL (without source generator)
        run: |
          dotnet clean --nologo -c Release
          dotnet build --nologo -c Release
        env:
          # Disable source generator to avoid OOM in CodeQL
          # Uses stub data classes from CodeQLStubs.cs instead
          DISABLE_SOURCE_GENERATOR: true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"

      - name: Package CLI binaries
        run: |
          # Self-contained single-file binaries (AOT causes issues with dependencies)
          dotnet publish SynthEHR/SynthEHR.csproj -o dist/linux-x64 -r linux-x64 -c Release --self-contained --nologo -p:PublishSingleFile=true -p:GenerateDocumentationFile=false
          dotnet publish SynthEHR/SynthEHR.csproj -o dist/win-x64 -r win-x64 -c Release --self-contained --nologo -p:PublishSingleFile=true -p:GenerateDocumentationFile=false
          dotnet publish SynthEHR/SynthEHR.csproj -o dist/osx-x64 -r osx-x64 -c Release --self-contained --nologo -p:PublishSingleFile=true -p:GenerateDocumentationFile=false
          dotnet publish SynthEHR/SynthEHR.csproj -o dist/osx-arm64 -r osx-arm64 -c Release --self-contained --nologo -p:PublishSingleFile=true -p:GenerateDocumentationFile=false

      - name: Create distribution archives
        run: |
          cd dist
          tar czf ../SynthEHR-cli-linux-x64.tar.gz linux-x64/
          tar czf ../SynthEHR-cli-osx-x64.tar.gz osx-x64/
          tar czf ../SynthEHR-cli-osx-arm64.tar.gz osx-arm64/
          cd ..
          zip -9rj SynthEHR-cli-win-x64.zip dist/win-x64/

      - name: Package NuGet
        run: |
          dotnet pack SynthEHR.Core/SynthEHR.Core.csproj \
            -p:DebugType=full \
            -p:SymbolPackageFormat=snupkg \
            -o . \
            --include-source \
            --include-symbols \
            --nologo \
            -c Release

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: SynthEHR-binaries
          path: |
            SynthEHR-cli-*.tar.gz
            SynthEHR-cli-*.zip
            *.nupkg
            *.snupkg

  # Runs only for v* tags, in its own job, so PR/branch builds never hold
  # id-token or contents write permissions.
  publish:
    needs: build-test-package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: write  # create GitHub release
      id-token: write  # NuGet Trusted Publishing (OIDC)

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: SynthEHR-binaries

      - name: Check tag matches package version
        run: |
          EXPECTED="SynthEHR.Core.${GITHUB_REF_NAME#v}.nupkg"
          if [ ! -f "$EXPECTED" ]; then
            echo "::error::Tag $GITHUB_REF_NAME expects $EXPECTED but found: $(ls -- *.nupkg)"
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: jas88

      - name: Publish to NuGet
        run: dotnet nuget push "*.nupkg" --skip-duplicate --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            SynthEHR-cli-*.tar.gz
            SynthEHR-cli-*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
