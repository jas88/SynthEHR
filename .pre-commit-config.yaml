# Pre-commit hooks for jas88 .NET projects
# Install: pip install pre-commit && pre-commit install
# (installs the pre-commit, pre-push and commit-msg hooks, as listed in default_install_hook_types)

default_install_hook_types: [pre-commit, pre-push, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        # Datasets.doc.xml: Descriptions.Get/GetAll return its text nodes verbatim (XElement.Value),
        # so the whitespace inside them is part of the public API.
        exclude: '\.md$|^Datasets\.doc\.xml$'
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-xml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=lf']

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.50.0
    hooks:
      - id: markdownlint
        # Rules are turned off in .markdownlint.yaml (copy it with this file), not with --disable here:
        # --disable takes every argument after it, including the file names pre-commit appends.
        args: ['--fix']

  - repo: local
    hooks:
      - id: build-source-generators
        name: build source generators (dotnet format needs their DLLs)
        entry: dotnet build SynthEHR.SourceGenerators/SynthEHR.SourceGenerators.csproj -v q --nologo
        language: system
        types: [c#]
        pass_filenames: false

      - id: dotnet-format
        name: dotnet format
        entry: dotnet format --verify-no-changes
        language: system
        types: [c#]
        pass_filenames: false

      - id: dotnet-build
        name: dotnet build
        entry: dotnet build
        language: system
        types: [c#]
        pass_filenames: false
        always_run: true
        stages: [pre-push]

# Commit message format (conventional commits)
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]
